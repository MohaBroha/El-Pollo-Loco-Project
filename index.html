<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Milonga&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="img/img/2_character_pepe/1_idle/idle/I-1.png">


    <title>El Pollo Loco</title>



    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/pickup-bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/statusbar.class.js"></script>
    <script src="models/coins-statusbar.class.js"></script>
    <script src="models/bottle-statusbar.class.js"></script>
    <script src="models/endboss-statusbar.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/throwable-object.js"></script>
    <script src="models/chicken.class.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="Levels/level1.js"></script>
    <script src="js/config/audio.config.js"></script>
    <script src="js/audio-manager.class.js"></script>
    <script src="models/world.class.js"></script>
</head>

<body>

    <h1>El Pollo Loco</h1>

    <div id="orientation-warning">
        Turn your Device to play.
    </div>

   <div id="game-container">
    <div id="startContainer">
        <canvas id="canvas" width="920" height="480"></canvas>

        <button id="startButton">Start</button>
        <button id="playAgainBtn">Play Again</button>

        <button id="fullscreen-btn">⛶</button>
        <button id="mute-btn">🔈</button>
        <button id="info-btn">ℹ️</button>

        <div id="touch-buttons">
            <button class="canvas-btn" id="leftBtn">⬅️</button>
            <button class="canvas-btn" id="jumpBtn">⬆️</button>
            <button class="canvas-btn" id="throwBtn">
                <img src="img/img/6_salsa_bottle/1_salsa_bottle_on_ground.png" alt="Throw Bottle">
            </button>
            <button class="canvas-btn" id="rightBtn">➡️</button>
        </div>

    </div>
</div>

    <div id="controls-overlay">
        <div id="controls-box">
            <h3>Steuerung</h3>
            <ul>
                <li>Bewegung: Pfeiltasten</li>
                <li>Springen: Leertaste</li>
                <li>Feuer: D</li>
            </ul>
            <button id="close-controls">Schließen</button>
        </div>
    </div>

    <div id="impressum">
        &copy; Mohamed Brohani 2025 Alle Rechte vorbehalten
        <a href="impressum.html">Impressum</a>
    </div>

    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>

</body>

</html>
